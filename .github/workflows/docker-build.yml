name: Build and Push Docker Images

# 构建拓扑（与 docs/docker-build-plan.md §6 对齐）：
#   base ──┬── agent（FROM :base，追加 qemu/semgrep/pi）
#          └── sextant（FROM :base，追加 qemu/musl-tools/bootstrap）
# base 必须先构建并推送，两个变体通过 BASE_IMAGE 指向本次的 base tag：
#   - push/dispatch：base 发 :base，变体照常发分支/sha/latest（保持既有 tag 契约）
#   - 同仓 PR：base 发 :base-pr-<num>，变体用该 tag 验证，不污染 :base
#   - fork PR：GITHUB_TOKEN 只读，base 只构建不推送，变体 job 跳过（避免必然失败的构建）
on:
  push:
    branches: [main, master]
    paths:
      - 'container/**'
      - '.github/workflows/docker-build.yml'
  pull_request:
    branches: [main, master]
    paths:
      - 'container/**'
      - '.github/workflows/docker-build.yml'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ---------- 公共 base（变体的 FROM 依赖）----------
  build-base:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.ref.outputs.image }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        # 与 push 条件保持一致：同仓 PR 需要写入 :base-pr-<num>；fork PR 无写权限
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute base image reference
        id: ref
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            tag="base-pr-${{ github.event.pull_request.number }}"
          else
            tag="base"
          fi
          echo "image=${REGISTRY}/${IMAGE_NAME}:${tag}" >> "$GITHUB_OUTPUT"

      - name: Build and push base image
        uses: docker/build-push-action@v6
        with:
          context: container
          file: container/Dockerfile.base
          platforms: linux/amd64
          # fork PR 无 packages:write：只构建校验，不推送（变体 job 同时跳过）
          push: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
          tags: ${{ steps.ref.outputs.image }}
          cache-from: type=gha,scope=base
          cache-to: type=gha,mode=max,scope=base

  # ---------- agent：base + qemu/libc6-dbg + semgrep + pi-coding-agent ----------
  build-agent:
    needs: build-base
    # 同上：fork PR 的 base 未推送，变体无法 FROM
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        # 与 push 条件保持一致：同仓 PR 需要写入 :base-pr-<num>；fork PR 无写权限
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix=,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push agent image
        uses: docker/build-push-action@v6
        with:
          context: container
          file: container/Dockerfile
          platforms: linux/amd64
          build-args: |
            BASE_IMAGE=${{ needs.build-base.outputs.image }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=agent
          cache-to: type=gha,mode=max,scope=agent

  # ---------- sextant-runtime：base + qemu/libc6-dbg/musl-tools + bootstrap ----------
  build-sextant:
    needs: build-base
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        # 与 push 条件保持一致：同仓 PR 需要写入 :base-pr-<num>；fork PR 无写权限
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=sextant,enable={{is_default_branch}}
            type=sha,prefix=sextant-,format=short

      - name: Build and push sextant image
        uses: docker/build-push-action@v6
        with:
          context: container
          file: container/Dockerfile.sextant
          platforms: linux/amd64
          build-args: |
            BASE_IMAGE=${{ needs.build-base.outputs.image }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=sextant
          cache-to: type=gha,mode=max,scope=sextant
